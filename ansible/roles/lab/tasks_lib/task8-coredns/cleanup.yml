---
# ConfigMap coredns живёт в kube-system, а не в {{ lab_namespace }} — снос
# namespace задачи его не тронет. Возвращаем ровно тот Corefile, который
# kubeadm+Calico ставят по умолчанию, чтобы не оставить сломанный/нестандартный
# DNS для всех остальных задач после ухода из этой.
- name: Вернуть коробочный Corefile
  kubernetes.core.k8s:
    kubeconfig: "{{ lab_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: coredns
        namespace: kube-system
      data:
        Corefile: |
          .:53 {
              errors
              health {
                 lameduck 5s
              }
              ready
              kubernetes cluster.local in-addr.arpa ip6.arpa {
                 pods insecure
                 fallthrough in-addr.arpa ip6.arpa
                 ttl 30
              }
              prometheus :9153
              forward . /etc/resolv.conf {
                 max_concurrent 1000
              }
              cache 30
              loop
              reload
              loadbalance
          }
