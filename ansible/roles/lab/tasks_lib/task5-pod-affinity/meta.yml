---
title: "Pod affinity: жёсткое правило, которое невыполнимо"
domain: Workloads & Scheduling
difficulty: hard
time: "18m"
hints:
  - "kubectl -n {{ lab_namespace }} describe pod -l app=cache | grep -A5 Events — у зависшей реплики будет 'didn't match pod anti-affinity rules'"
  - "посчитай: 3 реплики, 2 ноды, жёсткий запрет двум cache-подам делить ноду — сколько подов вообще может встать?"
  - "requiredDuringSchedulingIgnoredDuringExecution — это фильтр (нода либо подходит, либо нет), preferredDuringSchedulingIgnoredDuringExecution — это вес при выборе из подходящих. Второй вариант ничего не блокирует"
  - "у preferred другая структура: список из weight (1-100) и вложенного podAffinityTerm, а не просто labelSelector+topologyKey"
debrief: >-
  Главное различие: required — это жёсткий фильтр нод, и если подходящих нод
  физически не осталось, под висит в Pending бесконечно (планировщик не станет
  нарушать правило и не будет ничего вытеснять). preferred — это лишь весовая
  подсказка при ранжировании уже подходящих нод: намерение "разнести реплики"
  сохраняется, но при нехватке нод под всё равно поедет туда, где место есть.
  Поэтому anti-affinity для отказоустойчивости почти всегда стоит делать
  preferred, если число реплик может превысить число доменов отказа, а
  required оставлять только там, где совместное размещение действительно
  недопустимо.
