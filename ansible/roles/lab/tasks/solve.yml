---
# apply: true — это server-side apply. Обычный state: present делает
# strategic merge patch, который умеет только добавлять/менять поля, но НЕ
# удаляет те, что исчезли из манифеста. Для решений, где поле надо именно
# убрать (например, заменить requiredDuringScheduling на preferred), merge
# оставил бы оба правила сразу и решение не сработало бы.
- name: Применить эталонное решение поверх текущего состояния
  kubernetes.core.k8s:
    kubeconfig: "{{ lab_kubeconfig }}"
    state: present
    apply: true
    namespace: "{{ lab_namespace }}"
    definition: >-
      {{ lookup('template', lab_tasks_dir ~ '/' ~ lab_task ~ '/solution.yaml.j2')
         | from_yaml_all | list }}
