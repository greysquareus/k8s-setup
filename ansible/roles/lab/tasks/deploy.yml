---
# Namespace пересоздаётся целиком: так не нужно перечислять kind'ы,
# нет конфликтов с CRD (Calico регистрирует свой NetworkPolicy)
# и не воюем со служебными kube-root-ca.crt / default SA.
- name: Снести namespace {{ lab_namespace }} с прошлой задачей
  kubernetes.core.k8s:
    kubeconfig: "{{ lab_kubeconfig }}"
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ lab_namespace }}"
    wait: true
    wait_timeout: 180

- name: Создать namespace {{ lab_namespace }}
  kubernetes.core.k8s:
    kubeconfig: "{{ lab_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ lab_namespace }}"
        labels:
          app.kubernetes.io/managed-by: cka-lab

# Без default SA поды не создаются: "error looking up service account".
- name: Дождаться default ServiceAccount
  kubernetes.core.k8s_info:
    kubeconfig: "{{ lab_kubeconfig }}"
    api_version: v1
    kind: ServiceAccount
    namespace: "{{ lab_namespace }}"
    name: default
  register: lab_default_sa
  until: lab_default_sa.resources | length == 1
  retries: 20
  delay: 2

# Прогоняем cleanup-хуки ВСЕХ задач, а не только разворачиваемой. Задачи
# оставляют следы вне namespace (taint/label на нодах, PersistentVolume,
# ClusterIssuer, правленый Corefile), и снос namespace их не убирает. Иначе
# остатки предыдущей задачи молча ломают следующую: например, taint hw=gpu
# от task3 отрезает воркер планировщику. Все хуки идемпотентны.
- name: Найти cleanup-хуки всех задач
  ansible.builtin.find:
    paths: "{{ lab_tasks_dir }}"
    patterns: cleanup.yml
    recurse: true
  register: lab_cleanup_hooks

- name: Откатить изменения вне namespace от любых прошлых задач
  ansible.builtin.include_tasks: "{{ item }}"
  loop: "{{ lab_cleanup_hooks.files | map(attribute='path') | sort }}"
  loop_control:
    label: "{{ item | dirname | basename }}"

- name: Подготовить окружение задачи (setup)
  ansible.builtin.include_tasks: "{{ lab_tasks_dir }}/{{ lab_task }}/setup.yml"
  when: (lab_tasks_dir ~ '/' ~ lab_task ~ '/setup.yml') is exists

# apply: true — та же семантика, что у kubectl apply. Важно не только для
# единообразия: без записанной last-applied аннотации последующий apply
# (например, из action=solve) не сможет удалить поля, которых больше нет в
# манифесте, и решение вроде "заменить required на preferred" не сработает.
- name: Развернуть сломанные ресурсы
  kubernetes.core.k8s:
    kubeconfig: "{{ lab_kubeconfig }}"
    state: present
    apply: true
    namespace: "{{ lab_namespace }}"
    definition: >-
      {{ lookup('template', lab_tasks_dir ~ '/' ~ lab_task ~ '/broken.yaml.j2')
         | from_yaml_all | list }}

- name: Условие задачи
  ansible.builtin.debug:
    msg: "{{ lookup('template', lab_tasks_dir ~ '/' ~ lab_task ~ '/brief.md.j2').splitlines() }}"
