---
- name: Выбрать worker-ноду под GPU
  kubernetes.core.k8s_info:
    kubeconfig: "{{ lab_kubeconfig }}"
    kind: Node
  register: t3_nodes

# rejectattr с точечным путём вида metadata.labels.node-role.kubernetes.io/control-plane
# трактует каждую точку как переход к вложенному атрибуту, а ключ в labels — это
# одна строка "node-role.kubernetes.io/control-plane" с точками и слэшем внутри.
# Такой путь никогда не резолвится, поэтому фильтр ничего не отсеивал.
- name: Собрать имена worker-нод
  ansible.builtin.set_fact:
    t3_workers: >-
      {{ (t3_workers | default([]))
         + ([item.metadata.name] if "node-role.kubernetes.io/control-plane" not in (item.metadata.labels | default({})) else []) }}
  loop: "{{ t3_nodes.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Нет ни одной worker-ноды
  ansible.builtin.fail:
    msg: "В кластере нет worker-нод — задача требует минимум одного воркера"
  when: (t3_workers | default([])) | length == 0

- name: Запомнить имя ноды
  ansible.builtin.set_fact:
    t3_node: "{{ t3_workers | sort | first }}"

- name: Повесить label hw=gpu
  kubernetes.core.k8s:
    kubeconfig: "{{ lab_kubeconfig }}"
    state: patched
    kind: Node
    name: "{{ t3_node }}"
    definition:
      metadata:
        labels:
          hw: gpu

- name: Повесить taint dedicated=gpu:NoSchedule
  kubernetes.core.k8s_taint:
    kubeconfig: "{{ lab_kubeconfig }}"
    state: present
    name: "{{ t3_node }}"
    taints:
      - key: dedicated
        value: gpu
        effect: NoSchedule

- name: GPU-нода подготовлена
  ansible.builtin.debug:
    msg: "GPU-нода: {{ t3_node }}"
